services:
  node-red:
    image: nodered/node-red:3.1.9
    container_name: node-red
    restart: unless-stopped

    networks:
      traefik:
      lan:
        ipv4_address: 192.168.0.15

    ports:
      - "1880:1880"

    volumes:
      - ./data:/data

    environment:
      - TZ=America/New_York

    labels:
      - "traefik.enable=false"

networks:
  traefik:
    external: true

  lan:
    driver: macvlan
    driver_opts:
      parent: eno1
    ipam:
      config:
        - subnet: 192.168.0.0/24
          gateway: 192.168.0.1
